databases:
  - name: lux-rss-db
    plan: free
    databaseName: lux_rss
    user: lux_rss

services:
  - type: web
    name: lux-rss-web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run db:push && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lux-rss-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: REFRESH_TOKEN
        generateValue: true

  - type: cron
    name: lux-rss-cron
    runtime: node
    plan: starter
    region: frankfurt
    schedule: "0 6 * * *"
    buildCommand: npm install --include=dev
    startCommand: npx tsx scripts/fetch.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lux-rss-db
          property: connectionString
